<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJackson Research</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .menu { display: flex; background: #333; padding: 10px; color: white; }
        .menu-item { margin-right: 10px; padding: 10px 20px; cursor: pointer; background: #555; border-radius: 5px; }
        .menu-item.active { background: #ff5722; }
        .tab-container { display: flex; cursor: pointer; padding: 10px; background: #f1f1f1; }
        .tab { padding: 10px 20px; margin-right: 5px; border: 1px solid #ddd; border-radius: 5px; background: #eee; flex: 1; text-align: center; }
        .tab.active { background: white; border-bottom: none; font-weight: bold; }
        .tab-content, .page-content { display: none; padding: 20px; border: 1px solid #ddd; border-top: none; }
        .tab-content.active, .page-content.active { display: block; }
        iframe { width: 100%; border: none; height: 600px; }
    </style>
</head>
<body>
    <div class="menu">
        <div class="menu-item" onclick="showPage('mres-graphs')">MRes Graphs</div>
        <div class="menu-item active" onclick="showPage('sote')">SOTE</div>
    </div>

    <div id="sote" class="page-content active">
        <div class="tab-container">
            <div class="tab active" onclick="showTab('sote-tab0')">ICB Below</div>
            <div class="tab" onclick="showTab('sote-tab1')">CMB vs OR</div>
            <div class="tab" onclick="showTab('sote-tab2')">Elec and Gas vs CMB</div>
            <div class="tab" onclick="showTab('sote-tab3')">Elec and Gas vs OR</div>
            <div class="tab" onclick="showTab('sote-tab4')">Elec vs Clin</div>
            <div class="tab" onclick="showTab('sote-tab5')">Total Energy Map</div>
            <div class="tab" onclick="showTab('sote-tab6')">Electricity Map</div>
            <div class="tab" onclick="showTab('sote-tab7')">Gas Map</div>
            <div class="tab" onclick="showTab('sote-tab8')">Energy Consumption Change</div>
            <div class="tab" onclick="showTab('sote-tab9')">Building Age Distribution</div>
            <div class="tab" onclick="showTab('sote-tab10')">Maintenance Risk</div>
            <div class="tab" onclick="showTab('sote-tab11')">Socioeconomic & Health Indicators</div>
        </div>

        <div id="sote-tab0" class="tab-content active"><iframe src="ICB_below.html"></iframe></div>
        <div id="sote-tab1" class="tab-content"><iframe src="CMBvsOR.html"></iframe></div>
        <div id="sote-tab2" class="tab-content"><iframe src="elecandgasvsCMB.html"></iframe></div>
        <div id="sote-tab3" class="tab-content"><iframe src="elecandgasvsOR.html"></iframe></div>
        <div id="sote-tab4" class="tab-content"><iframe src="elecvsclin.html"></iframe></div>
        <div id="sote-tab5" class="tab-content"><iframe src="total_energy_map.html"></iframe></div>
        <div id="sote-tab6" class="tab-content"><iframe src="electricity_map.html"></iframe></div>
        <div id="sote-tab7" class="tab-content"><iframe src="gas_map.html"></iframe></div>
        <div id="sote-tab8" class="tab-content"><iframe src="energy_consumption_change_map.html"></iframe></div>
        <div id="sote-tab9" class="tab-content"><iframe src="building_age_distribution_map.html"></iframe></div>
        <div id="sote-tab10" class="tab-content"><iframe src="maintenance_risk_map.html"></iframe></div>
        <div id="sote-tab11" class="tab-content"><iframe src="socioeconomic_health_indicators_map.html"></iframe></div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));
            document.querySelector('.menu-item[onclick="showPage(\'' + pageId + '\')"]').classList.add('active');
            document.getElementById(pageId).classList.add('active');
        }
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector('.tab[onclick="showTab(\'' + tabId + '\')"]').classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        document.querySelector('.menu-item.active').click();
        document.querySelector('.tab.active').click();
    </script>
</body>
</html>
